name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create Android project
        run: |
          set -e
          mkdir -p app/src/main/java/com/planner/app app/src/main/assets app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cp index.html app/src/main/assets/index.html
          echo "" | base64 -d > app/planner.jks
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Planner"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.planner.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.planner.app'
                  minSdk 26
                  targetSdk 34
                  versionCode (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
                  versionName '1.0'
              }
              signingConfigs {
                  release {
                      storeFile file('planner.jks')
                      storePassword 'planner123'
                      keyAlias 'planner'
                      keyPassword 'planner123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/planner/app/MainActivity.java <<'EOF'
          package com.planner.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.loadUrl("file:///android_asset/index.html");
              }

              private class Bridge {
                  @JavascriptInterface
                  public void share(final String t) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              Intent i = new Intent(Intent.ACTION_SEND);
                              i.setType("text/plain");
                              i.putExtra(Intent.EXTRA_TEXT, t);
                              startActivity(Intent.createChooser(i, "Backup"));
                          }
                      });
                  }

                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                              pm.print("planner", web.createPrintDocumentAdapter("planner"), null);
                          }
                      });
                  }
              }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">برنامه‌ریز هفتگی</string>
          </resources>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="ic_bg">#0B7A75</color>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path
                  android:pathData="M34,56 L48,70 L76,40"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="8"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:fillColor="#00000000"/>
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: planner-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Planner v${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
